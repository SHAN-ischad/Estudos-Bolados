<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Exercício Login</title>
</head>

<body>
    <div class="content">
        <div class="left_content">
            <h1>Seja bem vindo <br> faça login</h1>
            <img src="img/imgLogin.png" />
        </div>

        <div class="right_content">
            <form action="#" method="dialog" id="form">
                <label>
                    <h2>Email</h2>
                    <input type="email" id="email">
                </label>

                <label>
                    <h2>Senha</h2>
                    <input type="password" id="password">
                </label>
                <button class="button" type="submit" id="bottom_form">Envar</button>
                <span class="bottom_form">Não tem conta? <a href="">Faça Cadastro</a></span>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
